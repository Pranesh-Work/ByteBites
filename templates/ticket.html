{% extends 'base.html' %}

<div class="ticket">

    <h2>FINAL BOSS DEFEATED 🎉</h2>
    <p>Ticket Number</p>

    <p>Total: ₹{{ order.total_amount }}</p>
    <p>Status: {{ order.status }}</p>
</div>
{% endblock %}
