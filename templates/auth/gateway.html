{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/gateway/gateway.css' %}">
{% endblock %}

{% block content %}

<section class="gateway-page">

     <!-- ==========================================
         Background Layer
    =========================================== -->
     <div class="gateway-bg" style="--gateway-bg:url('{% static 'images/backgrounds/gateway-bg.webp' %}');">
     </div>
     <!-- ==========================================
         Dark Overlay
    =========================================== -->

     <div class="overlay"></div>

     <!-- ==========================================
         Future Visual Effects
    =========================================== -->

     <div class="fog fog-left"></div>
     <div class="fog fog-right"></div>

     <div class="particles"></div>

     <!-- ==========================================
         Main Content
    =========================================== -->

     <div class="gateway-content">

          <!-- Hero -->

          <header class="hero">

               <img src="{% static 'images/auth/logo.webp' %}" alt="ByteBites Logo" class="logo">

               <h2>
                    THE CAMPUS QUEST MAP
               </h2>

               <p class="hero-subtitle">
                    Choose your destiny and begin your ByteBites adventure.
               </p>

          </header>

          <!-- Main Gateway -->

          <div class="gateway-map">

               <!-- Login Portal -->

               <a href="{% url 'login' %}" class="portal legacy">

                    <div class="portal-title">

                         LEGACY LOGIN

                    </div>

                    <img src="{% static 'images/auth/stone-door.webp' %}" alt="Stone Door">

               </a>

               <!-- Magic Core -->

               <div class="magic-core">

                    <div class="magic-ring ring-1"></div>

                    <div class="magic-ring ring-2"></div>

                    <div class="magic-circle"></div>

                    <div class="magic-glow"></div>

               </div>

               <!-- Signup Portal -->

               <a href="{% url 'signup' %}" class="portal signup">

                    <div class="portal-title">

                         NEW HERO SIGNUP

                    </div>

                    <img src="{% static 'images/auth/golden-crystal.webp' %}" alt="Golden Crystal">

               </a>

          </div>

     </div>

</section>

{% endblock %}
