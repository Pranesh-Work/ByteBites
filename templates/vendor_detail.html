{% extends 'base.html' %}
{% block content %}
<div class="vendor-hero">
    <h1>{{ vendor.name }}</h1>
    <p>{{ vendor.description }}</p>
    <p>📍 {{ vendor.venue }}</p>
    <p>₹{{ vendor.minimum_price }} - ₹{{ vendor.maximum_price }}</p>
</div>

<div class="category-grid">
    {% for category in vendor.categories.all %}
    <a class="category-card" href="{% url 'product_list' vendor.slug category.name %}">
        <h2>{{ category.name }}</h2>
        <p>Explore {{ category.name }} →</p>
    </a>
    {% endfor %}
</div>
{% endblock %}
