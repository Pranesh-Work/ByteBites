{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ByteBites</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

    {% block extra_css %}{% endblock %}

</head>

<body>

<main>

{% if messages %}
    {% for message in messages %}
        <div class="message">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

{% block content %}

{% endblock %}

</main>

</body>
</html>
